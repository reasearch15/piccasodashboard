# /etc/nginx/sites-available/payment.atlast.work
# Only this server_name is handled here; other sites are untouched.
# Replace 127.0.0.1:PORT with PICASSO_PORT. Obtain the certificate first:
#   sudo certbot certonly --nginx -d payment.atlast.work
# (certonly so certbot does not rewrite other server blocks).

server {
    listen 80;
    listen [::]:80;
    server_name payment.atlast.work;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name payment.atlast.work;

    ssl_certificate     /etc/letsencrypt/live/payment.atlast.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/payment.atlast.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 32k;

    location / {
        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts exactly these two (PICASSO_TRUST_PROXY=true): overwrite, never append.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Live dashboard updates (Server-Sent Events): no buffering, long reads.
    location = /api/events {
        proxy_pass http://127.0.0.1:PORT;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The local listener ingest endpoint must never be reachable from outside.
    location = /api/ingest/telegram-message { return 404; }
}
